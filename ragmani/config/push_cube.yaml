# PushCube-v1, end-effector delta-position control, I-JEPA image embeddings.
# Relative paths resolve against the repo root (act/).
env_id: PushCube-v1

paths:
  traj: ../robot-manipulation/PushCube-v1/trajectory.state.pd_ee_delta_pos.cpu.h5
  dataset: ../data/push_cube_jepa
  cache: .cache/hf
  run_dir: runs/push_cube

wandb:
  entity: ragmani
  project: ragmani
  mode: online                    # online, offline (upload later with `wandb sync`) or disabled

encoder:
  name: ijepa                     # key in models/encoders.py ENCODERS; siglip uses google/siglip-base-patch16-224
  model_id: jmtzt/ijepa_vith16_1k
  normalize: true

encode:
  batch_size: 32                  # frames per encoder forward pass
  max_episodes: null              # null encodes every episode

retrieval:
  index: ivf                    # exact (torch matmul) or ivf (FAISS, approximate)
  nlist: null                     # ivf cells; null uses sqrt(rows)
  nprobe: 8                       # ivf cells searched per query

model:
  name: rag_act
  state_dim: 9
  action_dim: 4
  chunk: 20
  image_layers: [512, 256, 128, 128, 128]   # hidden widths; input is the encoder dim, output is compressed
  state_layers: [32, 32, 32]
  compressed: 64                  # image and state each compress to this
  queries: 3                      # orthogonal query channels, one retrieval token each
  channel_hidden: 64
  token_dim: 64
  neighbours: 6                   # fetched per query
  keep: 3                         # of those, used per query
  draw: batch                     # key in models/policies.py DRAWS: batch shares one draw (rag_model.py), row draws per row and query
  d_model: 256
  heads: 8
  encoder_layers: 4
  decoder_layers: 4
  feedforward: 1024
  dropout: 0.1

# Values reproduce rag_model.py at 8b9a9e3; the comments name the alternative each switch offers.
train:
  epochs: 1500
  batch_size: 512
  lr: 1.0e-5                      # rag_model.py pins the LR to 1e-5 every step, so its plateau schedule never acts
  lr_scheduler: constant          # any transformers lr_scheduler_type; reduce_lr_on_plateau uses plateau below
  plateau: {factor: 0.1, patience: 5, threshold: 1.0e-3, min_lr: 1.0e-5}
  eval_steps: 1000
  save_epochs: 20                # a checkpoint every this many epochs (rag_model.py saved every 10000 steps); simulate scores any of them
  log_steps: 100
  split: frame                    # key in data/splits.py SPLITS: frame holds out random rows, episode whole demos
  eval_fraction: 0.2
  split_seed: 42
  exclude_own_episode: false      # true makes retrieval skip the row's own demo
  truth_coin: batch               # key in train/rag_act.py COINS: batch flips one add_gt coin per step, row one per row
  pad_weight: 1.0                 # is_pad BCE relative to the action L1
  dataloader_workers: 4
  seed: 42                        # the transformers default rag_model.py ran with
  simulate_epochs: 5              # one full sim episode, logged as video, every this many epochs; 0 turns it off
