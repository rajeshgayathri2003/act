# PushCube-v1 and PickCube-v1 in one model: both tasks' demos fill one memory, and simulate scores each task.
# Every other value comes from push_cube.yaml.
defaults: push_cube

tasks:
  - env_id: PushCube-v1
    traj: ../robot-manipulation/PushCube-v1/trajectory.state.pd_ee_delta_pos.cpu.h5
    dataset: ../data/push_cube_jepa
  - env_id: PickCube-v1
    traj: ../data/PickCube-v1/trajectory.state.pd_ee_delta_pos.cpu.h5   # the motion-planning demos converted to pd_ee_delta_pos
    dataset: ../data/pick_cube_jepa

paths:
  run_dir: runs/push_pick_cube
