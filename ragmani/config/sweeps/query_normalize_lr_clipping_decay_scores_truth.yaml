# A W&B sweep: create with `uv run --no-sync wandb sweep ragmani/config/sweeps/query_normalize_lr_clipping_decay_scores_truth.yaml` from act/,
# then run the `wandb agent` command it prints under `uv run --no-sync`, adding --forward-signals so a stopped run is re-queued.
name: query_normalize_lr_clipping_decay_scores_truth
description: >-
  A/B tests of what made observation_100 succeed (5-6/10 against 0/10), one change per run. The unchanged run uses its
  settings: search by the frame's own embedding, normalized state and action, lr 1e-4, no gradient clipping, weight decay
  1e-4, the truth row fading smoothly over 100 epochs, drawn per row, bf16 I-JEPA embeddings. The others change one of them back to rag_model.py's value, try
  lr 3e-4, add each neighbour's search similarity to attention, or fade the truth row in steps every 25 epochs.
  All train 100 epochs; best_success, best and final are then simulated on 20 layouts. Compare arms by success:
  with normalize=false the loss is in raw action units, so losses do not compare across arms.
entity: ragmani
project: ragmani
program: ragmani/train/rag_act.py   # the command below runs it as a module
method: grid
command:
  - ${env}
  - ${interpreter}
  - -m
  - ragmani.train.rag_act
  - push_cube
  - paths.run_dir=runs/query_normalize_lr_clipping_decay_scores_truth   # each test trains into a folder named after its change
  - wandb.mode=online
  - train.epochs=100
  - model.query=observation
  - model.normalize=true
  - train.lr=1e-4
  - train.max_grad_norm=0
  - train.weight_decay=1e-4
  - train.split=episode
  - train.exclude_own_episode=true
  - train.truth_schedule.mode=fixed_epochs
  - train.truth_schedule.epochs=100
  - train.simulate_epochs=10
  - train.simulate_after.episodes=20
  - train.truth_sampling=per_row                # each row gets the truth row on its own draw
  - model.keep_sampling=per_row                 # each row and search keeps its own 3 of the 6 neighbours
  - encoder.precision=bfloat16                  # about 4x faster simulate; needs the bf16 dataset
  - paths.dataset=../data/push_cube_jepa_bf16
  - train.save_epochs=20                        # checkpoints to resume from, so a stopped test loses at most 20 epochs
  - train.resume=true                           # a re-queued test continues from its folder's latest checkpoint
  - ${args_no_hyphens}
parameters:
  test:                             # one change per run, applied after the settings above
    values:
      - unchanged
      - model.query=learned
      - model.normalize=false
      - train.lr=1e-5
      - train.lr=3e-4
      - train.max_grad_norm=1.0
      - train.weight_decay=0
      - model.search_scores_in_attention=true
      - train.truth_schedule.mode=stepped
